name: Android CI

# Runs on every push and pull request, per the Part 2 brief requirement
# that the workflow "trigger automated builds and execute your unit tests
# on every push to verify your codebase functions outside of your local
# environment."
#
# Uses gradle/actions/setup-gradle rather than the committed ./gradlew
# wrapper: the wrapper's binary jar isn't checked into this repo (see
# README "Gradle wrapper" section) — Android Studio regenerates it
# automatically on first open, but CI needs its own Gradle, which this
# action provides and caches.
on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      # google-services.json is git-ignored (see .gitignore) since it's
      # per-developer Firebase config and shouldn't be committed. CI needs
      # *a* file in that path to let the Google Services Gradle plugin run,
      # so it copies the safe placeholder committed alongside the code.
      # This is enough for the build/lint/unit-test steps below, which don't
      # need a real Firebase connection — it is NOT enough for anything that
      # actually calls Firebase at runtime (e.g. connected instrumentation
      # tests against a real project), which would need a real config
      # injected via a GitHub Actions secret instead.
      - name: Provide placeholder Firebase config for CI
        run: cp app/google-services.json.example app/google-services.json

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hivemarket-debug-apk
          path: app/build/outputs/apk/debug/*.apk
