org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9.0+ ships "built-in Kotlin support" enabled by default, which
# registers its own `kotlin` extension. This project still applies the
# classic org.jetbrains.kotlin.android plugin explicitly (see app/build.gradle.kts),
# which collides with that and fails with:
#   "Cannot add extension with name 'kotlin', as there is an extension
#    already registered with that name."
# This flag opts back into the classic behaviour so the explicit plugin
# keeps working as before, without needing to migrate to AGP's new
# built-in-Kotlin configuration right now. Official migration guide for
# when there's time to do it properly:
# https://developer.android.com/build/migrate-to-built-in-kotlin
# NOTE: this opt-out is removed entirely in AGP 10 — migrate before then.
android.builtInKotlin=false

# Separately: AGP 9.0 also replaced its internal DSL types entirely (the
# new ApplicationExtensionImpl no longer implements the old BaseExtension
# class). The classic Kotlin Android plugin still expects BaseExtension
# internally, so without this flag you'll hit:
#   "class ...ApplicationExtensionImpl$AgpDecorated_Decorated cannot be
#    cast to class com.android.build.gradle.BaseExtension"
# This flag restores the old DSL types alongside the new ones so that cast
# succeeds. Also removed in AGP 10 — both flags exist purely to buy time
# before a real migration to AGP's new APIs.
android.newDsl=false
